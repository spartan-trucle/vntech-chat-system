<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat system architecture</title>
<meta name="description" content="High-level architecture of the vntech chat system with the send, offline, and history/media flows highlighted.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F8; --ink:#16212E; --ink-2:#4A5666; --line:#D3DAE3; --card:#FFFFFF;
  --teal:#0F7B83; --teal-bg:#DDF0F1; --violet:#5B4FB7; --violet-bg:#E7E4F6; --amber:#B9771A; --amber-bg:#FBF1E1;
  --slate:#4A5666; --slate-bg:#E6EAF0; --rose:#B4474D; --rose-bg:#F8E4E5; --orange:#C2611B; --orange-bg:#FBE8DA;
  --edge:#7A8798; --edge-strong:#16212E; --core:#0F7B83; --core-bg:rgba(15,123,131,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F161F; --ink:#E6ECF2; --ink-2:#9AA8B8; --line:#273341; --card:#141D28;
  --teal:#5ECBD3; --teal-bg:#123A3E; --violet:#A79BF0; --violet-bg:#2A2650; --amber:#E0A24A; --amber-bg:#3A2A10;
  --slate:#B7C2CF; --slate-bg:#243040; --rose:#F08A8F; --rose-bg:#48232A; --orange:#F0995B; --orange-bg:#3F2515;
  --edge:#6F7F92; --edge-strong:#E6ECF2; --core:#5ECBD3; --core-bg:rgba(94,203,211,.07);
}}
:root[data-theme="dark"]{
  --paper:#0F161F; --ink:#E6ECF2; --ink-2:#9AA8B8; --line:#273341; --card:#141D28;
  --teal:#5ECBD3; --teal-bg:#123A3E; --violet:#A79BF0; --violet-bg:#2A2650; --amber:#E0A24A; --amber-bg:#3A2A10;
  --slate:#B7C2CF; --slate-bg:#243040; --rose:#F08A8F; --rose-bg:#48232A; --orange:#F0995B; --orange-bg:#3F2515;
  --edge:#6F7F92; --edge-strong:#E6ECF2; --core:#5ECBD3; --core-bg:rgba(94,203,211,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.1;margin:0}
header p{margin:4px 0 0;color:var(--ink-2);max-width:60ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools button{font:inherit;font-size:.9rem;font-weight:500;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.tools button[aria-pressed="true"]{color:var(--teal);border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.tools button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.tools .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
svg{display:block;width:100%;height:auto;font-family:"IBM Plex Sans",system-ui,sans-serif}
.node rect.box{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.node .ic{stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.node .label{font-size:15px;font-weight:600;fill:var(--ink)}
.node .sub{font-size:12px;fill:var(--ink-2)}
.node.t-service rect.box{stroke:var(--teal)} .node.t-service .icbg{fill:var(--teal-bg)} .node.t-service .ic{stroke:var(--teal)}
.node.t-data rect.box{stroke:var(--violet)} .node.t-data .icbg{fill:var(--violet-bg)} .node.t-data .ic{stroke:var(--violet)}
.node.t-edge rect.box{stroke:var(--amber)} .node.t-edge .icbg{fill:var(--amber-bg)} .node.t-edge .ic{stroke:var(--amber)}
.node.t-client .icbg{fill:var(--slate-bg)} .node.t-client .ic{stroke:var(--slate)}
.node.t-queue rect.box{stroke:var(--orange)} .node.t-queue .icbg{fill:var(--orange-bg)} .node.t-queue .ic{stroke:var(--orange)}
.node.t-disc rect.box{stroke:var(--rose)} .node.t-disc .icbg{fill:var(--rose-bg)} .node.t-disc .ic{stroke:var(--rose)}
.node.core rect.box{stroke-width:2.5}
.edge path{fill:none;stroke:var(--edge);stroke-width:1.8;marker-end:url(#arrow)}
.edge.strong path{stroke:var(--edge-strong);stroke-width:2.4;marker-end:url(#arrow-strong)}
.edge.dashed path{stroke-dasharray:6 5}
.edge text{font-size:12px;fill:var(--ink-2);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.region rect{fill:var(--core-bg);stroke:var(--core);stroke-width:1.5;stroke-dasharray:8 6}
.region text{font-size:13px;font-weight:600;fill:var(--core)}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;margin:14px 4px 0;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid;display:inline-block}
/* flow highlighting */
svg[data-flow] .edge,svg[data-flow] .node{transition:opacity .25s}
svg[data-flow="send"] .edge:not([data-flows~="send"]),svg[data-flow="send"] .node:not([data-flows~="send"]),
svg[data-flow="offline"] .edge:not([data-flows~="offline"]),svg[data-flow="offline"] .node:not([data-flows~="offline"]),
svg[data-flow="history"] .edge:not([data-flows~="history"]),svg[data-flow="history"] .node:not([data-flows~="history"]){opacity:.16}
svg[data-flow="send"] .edge[data-flows~="send"] path,svg[data-flow="offline"] .edge[data-flows~="offline"] path,svg[data-flow="history"] .edge[data-flows~="history"] path{stroke:var(--teal);marker-end:url(#arrow-teal)}
@media (prefers-reduced-motion:reduce){svg[data-flow] .edge,svg[data-flow] .node{transition:none}}
.story{margin:14px 4px 0;color:var(--ink-2);min-height:1.5em;max-width:80ch}
.story b{color:var(--ink);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Chat system architecture</h1>
    <p>Twelve components, one rule: the WebSocket carries only what must be pushed now. Everything else goes over HTTPS.</p>
  </div>
  <div class="tools" role="group" aria-label="Highlight a flow">
    <button type="button" data-flow="" aria-pressed="true">All</button>
    <button type="button" data-flow="send" aria-pressed="false">Send a message</button>
    <button type="button" data-flow="offline" aria-pressed="false">Offline recipient</button>
    <button type="button" data-flow="history" aria-pressed="false">History and media</button>
    <span class="sep"></span>
    <button type="button" id="theme" aria-label="Toggle dark mode">Dark</button>
  </div>
</header>

<figure>
<svg id="d" viewBox="0 40 1320 640" role="img" aria-labelledby="t">
<title id="t">High-level architecture of the chat system</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker>
  <marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge-strong)"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--teal)"/></marker>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
  <symbol id="i-lb" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-3h14v3"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6.5h.01M6 17.5h.01"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></symbol>
  <symbol id="i-kv" viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></symbol>
  <symbol id="i-radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16.2 7.8l-2.1 6.3-6.3 2.1 2.1-6.3z"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
</defs>

<!-- real-time core region -->
<g class="region"><rect x="556" y="280" width="748" height="378" rx="18"/><text x="1286" y="302" text-anchor="end">Real-time core</text></g>

<!-- edges -->
<g class="edge strong" data-flows="send offline history"><path d="M240 362H318"/><text x="279" y="308" text-anchor="middle">HTTPS + WebSocket</text></g>
<g class="edge" data-flows="history"><path d="M410 320V166"/><text x="420" y="248">HTTPS</text></g>
<g class="edge strong" data-flows="send offline"><path d="M500 362H578"/><text x="539" y="308" text-anchor="middle">WebSocket</text></g>
<g class="edge dashed" data-flows=""><path d="M410 404V558"/><text x="420" y="486">healthy chat servers</text></g>
<g class="edge strong" data-flows="send offline"><path d="M670 320V166"/><text x="680" y="248">write message</text></g>
<g class="edge" data-flows="send offline"><path d="M760 362H838"/><text x="799" y="308" text-anchor="middle">route lookup, lease</text></g>
<g class="edge" data-flows="send offline"><path d="M670 404V558"/><text x="680" y="486">append, replay from cursor</text></g>
<g class="edge" data-flows=""><path d="M1020 362H1098"/><text x="1059" y="308" text-anchor="middle">state change</text></g>
<g class="edge dashed" data-flows=""><path d="M1190 404V470H720V406"/><text x="955" y="462" text-anchor="middle">notify friends on their chat servers</text></g>
<g class="edge" data-flows="offline"><path d="M760 602H838"/><text x="799" y="548" text-anchor="middle">no route: offline</text></g>
<g class="edge" data-flows="offline"><path d="M1020 602H1098"/><text x="1059" y="548" text-anchor="middle">push hint, no body</text></g>
<g class="edge" data-flows="history"><path d="M500 122H578"/><text x="539" y="68" text-anchor="middle">page history by cursor</text></g>
<g class="edge" data-flows="history"><path d="M320 122H242"/><text x="281" y="68" text-anchor="middle">pre-signed URL</text></g>
<g class="edge dashed" data-flows="history"><path d="M150 320V166"/><text x="160" y="248">upload / download bytes</text></g>

<!-- nodes -->
<g class="node t-edge" data-flows="history" transform="translate(60 80)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-cloud" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">Object storage</text><text class="sub" x="68" y="58">+ CDN, media ≤ 10 MB</text></g>
<g class="node t-service" data-flows="history" transform="translate(320 80)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-server" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">API servers</text><text class="sub" x="68" y="58">stateless, HTTPS</text></g>
<g class="node t-data" data-flows="send offline history" transform="translate(580 80)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-db" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">Message store</text><text class="sub" x="68" y="58">Cassandra, 5 years</text></g>

<g class="node t-client" data-flows="send offline history" transform="translate(60 320)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-phone" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">Clients</text><text class="sub" x="68" y="58">mobile and web, ≤ 5 devices</text></g>
<g class="node t-edge" data-flows="send offline history" transform="translate(320 320)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-lb" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">Load balancer</text><text class="sub" x="68" y="58">L4, least connections</text></g>
<g class="node t-service core" data-flows="send offline" transform="translate(580 320)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-bolt" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">Chat servers</text><text class="sub" x="68" y="58">stateful, WebSocket</text></g>
<g class="node t-data" data-flows="send offline" transform="translate(840 320)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-kv" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">Redis</text><text class="sub" x="68" y="58">routing, presence lease</text></g>
<g class="node t-service" data-flows="" transform="translate(1100 320)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-radio" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">Presence</text><text class="sub" x="68" y="58">online / offline fan-out</text></g>

<g class="node t-disc" data-flows="" transform="translate(320 560)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-compass" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">Service discovery</text><text class="sub" x="68" y="58">etcd, servers register</text></g>
<g class="node t-queue" data-flows="send offline" transform="translate(580 560)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-inbox" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">Sync queue</text><text class="sub" x="68" y="58">one cursor per device</text></g>
<g class="node t-service" data-flows="offline" transform="translate(840 560)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-bell" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">Notification</text><text class="sub" x="68" y="58">for offline recipients</text></g>
<g class="node t-client" data-flows="offline" transform="translate(1100 560)"><rect class="box" width="180" height="84" rx="12"/><rect class="icbg" x="12" y="20" width="44" height="44" rx="10"/><use class="ic" href="#i-send" x="22" y="30" width="24" height="24"/><text class="label" x="68" y="38">APNs / FCM</text><text class="sub" x="68" y="58">wakes the device</text></g>
</svg>
</figure>

<p class="story" id="story"></p>

<div class="legend" aria-label="Legend">
  <span><i style="border-color:var(--teal)"></i>Service</span>
  <span><i style="border-color:var(--violet)"></i>Data store</span>
  <span><i style="border-color:var(--amber)"></i>Edge and storage infrastructure</span>
  <span><i style="border-color:var(--orange)"></i>Queue</span>
  <span><i style="border-color:var(--rose)"></i>Discovery</span>
  <span><i style="border-color:var(--line)"></i>Client or external</span>
  <span><svg width="34" height="10" viewBox="0 0 34 10"><path d="M1 5H31" stroke="var(--edge)" stroke-width="2" stroke-dasharray="6 5"/></svg>asynchronous or out-of-band</span>
</div>
</div>
<script>
(function(){
  var svg=document.getElementById('d'),story=document.getElementById('story');
  var text={
    '':'',
    send:'<b>Send a message.</b> The sender’s device is already attached to a chat server over WebSocket. The server writes the message to the store, acks the sender, looks up each recipient device’s server in Redis, pushes to those servers, and appends to every device’s sync queue so a reconnecting device can replay from its cursor.',
    offline:'<b>Offline recipient.</b> The route lookup finds no server for that device. The message waits in the device’s sync queue, and the notification service sends a push hint through APNs or FCM. The body never leaves our infrastructure; the app fetches it on wake.',
    history:'<b>History and media.</b> Nothing here touches a chat server. Opening a conversation pages the newest 50 messages by cursor from the API servers; scrolling up pages older ones. Media bytes move straight between the client and object storage via a pre-signed URL that encodes the 10 MB limit.'
  };
  document.querySelectorAll('.tools button[data-flow]').forEach(function(b){
    b.addEventListener('click',function(){
      var f=b.getAttribute('data-flow');
      document.querySelectorAll('.tools button[data-flow]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
      if(f)svg.setAttribute('data-flow',f);else svg.removeAttribute('data-flow');
      story.innerHTML=text[f];
    });
  });
  var root=document.documentElement,btn=document.getElementById('theme');
  function cur(){var t=root.getAttribute('data-theme');if(t)return t;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
  function apply(t){root.setAttribute('data-theme',t);btn.textContent=t==='dark'?'Light':'Dark';try{localStorage.setItem('theme',t)}catch(e){}}
  try{var s=localStorage.getItem('theme');if(s)apply(s);else btn.textContent=cur()==='dark'?'Light':'Dark'}catch(e){}
  btn.addEventListener('click',function(){apply(cur()==='dark'?'light':'dark')});
})();
</script>
</body>
</html>
